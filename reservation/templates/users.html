{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <title>Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            min-height: 100vh;
            overflow: auto;
            background: transparent;
            background-color: rgba(240, 240, 244, 0.95);
            color: rgb(16, 14, 14);
            overflow-x: hidden;


        }
        .app-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px;
        }
        header {
            height: auto;
            min-height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color:rgb(22, 51, 233);
            color: rgb(240, 241, 247);
            border-bottom: 1px solid;
            position: fixed;
            top: 0;
            z-index: 100;
            width: 100%;
            flex-direction: column;
            left: 0;
            padding: 10px 20px;
            border-color: rgb(32, 114, 180);
            }
        
        .main {
            padding: 15px;
            margin-bottom: 15px;
            margin-top: 5px;
            padding-bottom: 70px;
            border-radius: 8px;
            border: 1px solid;
        }
        footer {
            height: auto;
            min-height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color:rgb(22, 51, 233);
            color: rgb(240, 241, 247);
            border-bottom: 1px solid;
            position: fixed;
            z-index: 10;
            width: 100%;
            flex-direction: column;
            left: 0;
            padding: 10px 20px;
            border-color: rgb(32, 114, 180);
            bottom: 0;
        }

        .btn {
            width: 100%;
            background-color: rgb(22, 51, 233);
            border: transparent;
            border-radius: 4px;
            padding: 10px 15px;
            margin-top: 10px;
            color: white;
            cursor: pointer;
        }
        .btn:hover{
            background-color: rgb(15, 30, 123);
        }
        .btn:active {
            transform: scale(1.1);
        }
        .annule {
            width: 100%;
            background-color: transparent;
            border-radius: 24px;
            padding: 10px 15px;
            margin-top: 10px;
            border: 1px solid black;
        }
        .annule:hover {
            background-color: rgb(247, 74, 74);
        }
        form input {
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            border: 1px solid rgb(137, 141, 142);
            border-radius: 3px;
        }

        #tarif{
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            border: 1px solid rgb(137, 141, 142);
            border-radius: 3px;         
        }
        form input:focus {
            border-color: rgba(246, 10, 10, 0.877);
            outline: none;
            box-shadow: 0 0 10px red;

        }
        form label {
            display: flex;
            width: 100%;
            max-width: 450px;
            text-align: center;
            justify-content: center;
            font-size: 17px;
        }
        .recherche {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 5px;
        }
        .nome {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            color: blue;
        }
        .rechercher{
            font-size: 12px;
            background-color: white;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            text-align: center;
            justify-content: center;
            border: 2px solid rgb(239, 244, 246);
            border-radius: 7px;
            width: 100%;
            padding: 14px 14px;
            margin-top: 15px;
            color: rgb(10, 12, 23);
        }
        .rechercher:focus {
            border-color: rgb(255, 0, 0);
            outline: none;
            border: 1px solid rgb(255, 0, 0);
            box-shadow: 0 0 10px rgb(242, 8, 8);
        }
        .rechercher input::placeholder {
            font-size: italic;
        }
        /*h2 {
            font-size: 15px;
            color: rgb(244, 244, 251);
            background-color: rgba(244, 246, 247, 0.978);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            justify-content: center;
            border: 1px solid black;
            border-color: rgb(49, 0, 128);
            border-radius: 15px;
            width: 100%;
            padding: 14px 14px;

        }*/
        h3 {
            width: 100%;
            padding: 17px 15px;
            color: white;
            margin-top: 10px;
        }
        .head {
            background-color: transparent;
            border: 1px solid rgb(228, 230, 230);
            padding: 10px 12px;
            background-color: transparent;
            border-radius: 12px;
            cursor: pointer;
            color: rgb(250, 248, 248);
            
        } 
        .head:active {
            transform: scale(1.1);
        }
 
        .head.active {
            background-color: rgb(237, 237, 239);
            color: black;
        }
        #message {
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            /*border: 1px solid rgb(229, 24, 24);*/
            border-radius: 13px;
            margin-top: 80px;
        }
        .dec {
            font-size: 15px;
            color: rgb(246, 18, 18);
            background-color: transparent;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            justify-content: center;
            border-radius: 15px;
            border: 1px solid black;
            width: 35%;
            padding: 12px 18px;
            margin-top: 400px;
            cursor: pointer;
        }
        .dec:hover{
            background-color: rgba(226, 72, 72, 0.5);
            transform: stretch();
            /*filter: frost();
            animation: pour();
            gravity: cursor;*/
        }
        .dec:active{
            transform: scale(1.1);
        }
        .contenu {
            display: block;
            align-items: center;
            justify-content: center;
            width: 150%;
            max-width: 450px;
            padding: 40px 40px;
            overflow-y: auto;
        }
        .chambre-card {
            align-items: center;
            justify-content: center;
            display: block;
            width: 100%;
            max-width: 450px;
            padding: auto;
            margin-top: 20px;
         }
        
        img {
            width: 100%;
            border: 3px solid #1557d6;
        }
        a {
         text-decoration: none;
         color: rgb(22, 51, 233);
        }
        .posteur { 
            width: 100%;
            max-width: 450px;
        }

        .rech {
            color: rgb(245, 246, 246);
            width: 24%;
            margin-top: 15px;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        .rech:hover {
            text-decoration: blue;
            
        }
        .op {
            color: white;
            width: 34px;
            border: none;
            cursor: pointer;
            background-color: transparent;
            margin-top: 15px;
            margin-right: 15px;
        }
        .tete {
            justify-content: space-between;
            align-items: center;
            display: flex;
            width: 100%;
            gap: 15px;
            height: 55px;
            background-color: rgb(22, 51, 233);
        }
        .opt {
            background-color: transparent;
            border: none; 
            font-size: 24px;
            color: white;
            padding: 8px;
               }
        .opt:hover {
            background-color: blue;
            cursor: pointer;
        }
        #modifier, #form, .pro{
            margin-top: 40px;
        }
        .add.active{
            background-color: rgb(22, 51, 233);
        }
        .page {
            margin-top: 0px;
        }
        .main{
            margin-top: 10px;
        }
        .titre {
            border-top: 0;
            background-color: transparent;
            border-radius: 5cqmax;
            border: 5px solid rgb(20, 187, 228);
            padding: 5px 25px;
            color: beige;
        }
        #para {
            margin-top: 100px;
            width: 100%;
        }
        h5 {
            display: flex;
            align-items: center;
            justify-content: center;
            color: gray;
        }
        h4 {
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(14, 22, 174);
            background-color: white;
            border: 1px solid rgb(26, 59, 245);
            width: 100%;
            height: 35px;
            font-size: 17px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
                .tarif {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .mois, .heure, .jour {
            background-color: rgb(208, 220, 233);
            border: 2px solid rgb(246, 246, 247);
            border-radius: 8px;
            width: 100%;
            font-size: 15px;
            color: #0c295f;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            padding: 5px;
            align-items: center;
            justify-content: center;
            display: flex;
            cursor: pointer;
            margin-right: 5px;

        }
        .slider {
    position: relative;
    width: 100%;
    overflow: hidden;
}

.slider .slide {
    display: none;
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.slider .slide.active {
    display: block;
}

.slider .prev, .slider .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    color: white;
    border: none;
    font-size: 1.5rem;
    padding: 0 10px;
    cursor: pointer;
    z-index: 1;
}

.slider .prev { left: 0; }
.slider .next { right: 0; }

.bullets {
    text-align: center;
    padding: 6px 0;
}

.bullet {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
    margin: 0 3px;
    cursor: pointer;
}

.bullet.active { background: #333; }

h7 {
    color: black;
}
.btn-grise {
    background-color: #999;
    color: #fff;
    cursor: not-allowed;
    opacity: 0.75;
}
        .room-photo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid;
            object-fit: cover;
            background: #e9edf5;
        }

    </style>
</head>
<body>
    <script src="{% static 'reservation/js/profile_users.js' %}" defer></script>

    <div class="container">
        <h2>La plateforme de reservation d'hotel</h2>

        <header>
            <div class="nome">
                <!--h2 class="titre">MY RESERVA HOTEL</h2-->
            </div>
            <div class="recherche">
                <button class="op" title="mon profile">☰</button>
                <input class="rechercher" type="text" name="q" value="{{query}}" placeholder="Rechercher un hôtel, une ville, un secteur... 🔍">
                <button onclick="Rechercher()" class="rech">Rechercher</button>
            </div>
        </header>
        <div class ="main">

            <div id="acceuil" class="page" >
                <div class="acceuil-contenaire">
                    <br>
                    <br>
                    <div class="posteur">
                        <div class="contenu">
                        </div>           
                    </div>
                </div>
            </div>
            <div id="message">

            </div>
            <form action="" id="Rform">
                {% csrf_token %}
                <div id="reservation" class="page" style="display: none;">
                    <div class="r-nom">
                        <label for="nom" class="label-r">Nom</label>
                        <input type="text" id="nom" placeholder="Nom" required>

                        <label for="prenom" class="label-r">Prenom</label>
                        <input type="text" id="prenom" placeholder="Prenom" required>
                    </div>
                    <div class="tel">
                        <label for="tel" class="label-r">Télephone</label>
                        <input type="tel" id="tel" placeholder="+226 75002136" required>
                    </div>
                    <div class="r-tarif">
                        <label for="tarif" class="label-r">Séjour</label>
                            <select name="tarif" id="tarif">
                                <option value="heure">heure</option>
                                <option value="jour">Jour</option>
                                <option value="mois">Mois</option>
                            </select>
                    </div>
                    <div class="r-temps">
                        <label for="temps" class="label-r">Temps</label>
                        <input type="number" id="temps" placeholder="nombre de jour/heure/mois" required>
                    </div>
                    <button type="submit" title="valider et payer" class="btn">Passer au paiement</button>
                </div>
            </form>
            <div id="contenu_recherche" class="page" style="display: none;">

            </div>
            <div id="favoris" class="page" style="display: none;">
                <h5>Aucun favoris pour l'instant</h5>
            </div>
        </div>
        <footer>
            <div class="nav">
                <button onclick="afficherPage('acceuil')" class="head active" title="acceuil principal">
                    <i class="ti ti-home"></i> Accueil</button>
                <button onclick="afficherPage('favoris')" class="head" title="reservation des clients">
                    <i class="ti ti-heart"></i> Favoris</button>
                <button onclick="afficherPage('reservations')" class="head" title="reservation des clients">
                    <i class="ti ti-history"></i> Historiques</button>
            </div>
        </footer>
    </div>

</body>
</html>
