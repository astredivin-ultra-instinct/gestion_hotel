{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            min-height: 100vh;
            overflow: auto;
            background: transparent;
            background-color: rgba(240, 240, 244, 0.95);
            color: rgb(16, 14, 14);
            overflow-x: hidden;


        }
        .app-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px;
        }
        header {
            height: auto;
            min-height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(28, 85, 120);
            color: rgb(240, 241, 247);
            border-bottom: 1px solid;
            position: fixed;
            top: 0;
            z-index: 100;
            width: 100%;
            flex-direction: column;
            left: 0;
            padding: 10px 20px;
            border-color: rgb(32, 114, 180);
            }
        
        .main {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid;
        }
        footer {
            height: 60px;
            border-top: 1px solid;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: flex;
            background-color:rgb(28, 85, 120);
            position: sticky;
            bottom: 0;
        }
        .add {
            position: absolute;
            top: -10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgb(0,0,0,0.2);
            cursor: pointer;
            background-color: rgb(10, 119, 245);
        }
        .add:hover{
            background-color: rgb(13, 91, 103);
        }
        .add:active {
            transform:  scale(1.1);
        }
        .btn {
            width: 100%;
            background-color: rgb(8, 126, 237);
            border: transparent;
            border-radius: 24px;
            padding: 10px 15px;
            margin-top: 10px;
        }
        .btn:hover{
            background-color: rgb(19, 79, 113);
        }
        .btn:active {
            transform: scale(1.1);
        }
        .annule {
            width: 100%;
            background-color: transparent;
            border-radius: 24px;
            padding: 10px 15px;
            margin-top: 10px;
            border: 1px solid black;
        }
        .annule:hover {
            background-color: rgb(247, 74, 74);
        }
        form input {
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            border: 2px solid rgb(137, 141, 142);
            border-radius: 13px;
        }
        #tarif{
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            border: 2px solid rgb(137, 141, 142);
            border-radius: 13px;         
        }
        form input:focus {
            border-color: rgba(246, 10, 10, 0.877);
            outline: none;
            box-shadow: 0 0 10px red;

        }
        form label {
            display: flex;
            width: 100%;
            max-width: 450px;
            text-align: center;
            justify-content: center;
        }
        .recherche {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 5px;
        }
        .nome {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            color: blue;
        }
        .rechercher{
            font-size: 15px;
            background-color: transparent;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            text-align: center;
            justify-content: center;
            border: 2px solid rgb(239, 244, 246);
            border-radius: 15px;
            width: 100%;
            padding: 14px 14px;
            margin-top: 15px;
            color: rgb(250, 248, 248);
        }
        .rechercher:focus {
            border-color: rgb(255, 0, 0);
            outline: none;
            box-shadow: 0 0 10px rgb(233, 26, 26);
        }
        .rechercher input::placeholder {
            font-size: italic;
        }
        /*h2 {
            font-size: 15px;
            color: rgb(244, 244, 251);
            background-color: rgba(244, 246, 247, 0.978);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            justify-content: center;
            border: 1px solid black;
            border-color: rgb(49, 0, 128);
            border-radius: 15px;
            width: 100%;
            padding: 14px 14px;

        }*/
        h3 {
            width: 100%;
            padding: 17px 15px;
            color: rgb(6, 13, 217);
            margin-top: 10px;
        }
        .head {
            background-color: transparent;
            border: 1px solid rgb(228, 230, 230);
            padding: 10px 12px;
            background-color: transparent;
            border-radius: 12px;
            cursor: pointer;
            
        } 
        .head:active {
            transform: scale(1.1);
        }
 
        .head.active {
            background-color: rgb(13, 240, 252);
            color: rgb(24, 7, 7);
        }
        #message {
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            /*border: 1px solid rgb(229, 24, 24);*/
            border-radius: 13px;
            margin-top: 10px;
        }
        .dec {
            font-size: 15px;
            color: rgb(246, 18, 18);
            background-color: transparent;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            justify-content: center;
            border-radius: 15px;
            border: 1px solid black;
            width: 35%;
            padding: 12px 18px;
            margin-top: 400px;
            cursor: pointer;
        }
        .dec:hover{
            background-color: rgba(226, 72, 72, 0.5);
            transform: stretch();
            /*filter: frost();
            animation: pour();
            gravity: cursor;*/
        }
        .dec:active{
            transform: scale(1.1);
        }
        .contenu {
            display: block;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
            padding: 40px 40px;
            overflow-y: auto;
        }
        .chambre-card {
            align-items: center;
            justify-content: center;
            display: block;
            width: 100%;
            max-width: 100%;
            padding: auto;
            margin-top: 20px;
         }
        
        img {
            width: 100%;
        }
        a {
         text-decoration: none;
         color: rgb(17, 155, 253);
        }
        .posteur { 
            width: 100%;
            max-width: 450px;
        }

        .rech {
            color: rgb(0, 208, 255);
            width: 24%;
            margin-top: 15px;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        .rech:focus {
            text-decoration: blue;
            
        }
        .tete {
            justify-content: space-between;
            align-items: center;
            display: flex;
            width: 100%;
            gap: 15px;
            height: 55px;
            background-color: rgb(129, 235, 235);
        }
        .opt {
            background-color: transparent;
            border-color: rgb(248, 249, 250);
            border: none; 
            font-size: 24px;
            padding: 8px;
               }
        .opt:hover {
            background-color: gray;
        }
        #modifier, #form, .pro{
            margin-top: 100px;
        }
        .add.active{
            background-color: rgb(11, 74, 122);
        }
        .page {
            margin-top: 70px;
        }
        .main{
            margin-top: 15px;
        }
        .titre {
            border-top: 0;
            background-color: transparent;
            border-radius: 5cqmax;
            border: 5px solid rgb(20, 187, 228);
            padding: 5px 25px;
            color: beige;
        }
        #para {
            margin-top: 100px;
            width: 100%;
        }
        h5 {
            display: flex;
            align-items: center;
            justify-content: center;
            color: gray;
        }
    </style>
</head>
<body>
    <script src="{% static 'reservation/js/profile.js' %}" defer></script>

    <div class="container">
        <h2>La plateforme de reservation d'hotel</h2>

        <header>
            <div class="nome">
                <h2 class="titre">MY RESERVA HOTEL</h2>
            </div>
            <div class="recherche">
                <input class="rechercher" type="text" name="q" value="{{query}}" placeholder="Rechercher un hotel... 🔍">
                <button onclick="Rechercher()" class="rech">Rechercher</button>
            </div>
            <div class="nav">
                <button onclick="afficherPage('para')" class="head" title="paramètres">⚙️</button>
                <button onclick="afficherPage('acceuil')" class="head active" title="acceuil principal">Acceuil</button>
                <button onclick="afficherPage('profil')" class="head" title="mon profile">👤</button>
            </div>
        </header>
        <div class ="main">

            <div id="acceuil" class="page" >

                <div class="acceuil-contenaire">
                    <br>
                    <br>
                    <div class="posteur">
                        <div class="contenu">
                        </div>           
                    </div>
                </div>
            </div>
            <div id="message">

            </div>

            <div id="para" class="page" style="display: none;" >
                <h2>Paramètres de réglage</h2>
                <input type="hidden" name="csrfmiddlewaretoken" value="{{csrf_token}}">
                <button class="dec" title="se déconnecter">Déconnexion</button>
            </div>
            <div id="profil" class="page" style="display: none;">

            </div>
            <form action="" id="form">
                {% csrf_token %}
                <div id="add" class="page" style="display: none;">
                    <div class="c-numero">
                        <label for="numero" class="label-c">Numero de la chambre</label>
                        <input type="number" id="numero" placeholder="Numero de chambre" required>
                    </div>
                    <div class="c-etage">
                        <label for="etage" class="label-c">Numero de l'etage</label>
                        <input type="number" id="etage" placeholder="Air +" required>
                    </div>
                    <div class="c-nombre">
                        <label for="nombre" class="label-c">Nombre de chambre</label>
                        <input type="number" id="nombre" placeholder="1" required>
                    </div>
                    <div class="c-photo">
                        <label for="photo" class="label-c">Image/Photo</label>
                        <input type="file" id="photo" placeholder="Images" required>
                    </div>
                    <div class="c-prix_heure">
                        <label for="prix_heure" class="label-c">Prix par heure</label>
                        <input type="number" id="prix_heure" placeholder="prix/heure" required>
                    </div>
                    <div class="c-prix_jour">
                        <label for="prix_jour">Prix par jour</label>
                        <input type="number" id="prix_jour" placeholder="prix/jour" required>
                    </div>
                    <div class="c-prix_mois">
                        <label for="prix_mois" class="label-c">Prix par mois</label>
                        <input type="number" id="prix_mois" placeholder="prix/mois" required>
                    </div>
                    <button class="btn" type="submit" title="ajouter une chambre">Ajouter</button>                
                </div>
            </form>
            <form action="" id="Rform">
                <div id="reservation" class="page" style="display: none;">
                    <div class="r-nom">
                        <label for="nom" class="label-r">Nom</label>
                        <input type="text" id="nom" placeholder="Nom" required>
                    </div>
                    <div class="r-prenom">
                        <label for="prenom" class="label-r">Prenom</label>
                        <input type="text" id="prenom" placeholder="Prenom" required>
                    </div>
                    <div class="tel">
                        <label for="tel" class="label-r">Télephone</label>
                        <input type="tel" id="tel" placeholder="+226 75002136" required>
                    </div>
                    <div class="r-tarif">
                        <label for="tarif" class="label-r">Séjour</label>
                            <select name="tarif" id="tarif">
                                <option value="heure">heure</option>
                                <option value="jour">Jour</option>
                                <option value="mois">Mois</option>
                            </select>
                    </div>
                    <div class="r-temps">
                        <label for="temps" class="label-r">Temps</label>
                        <input type="number" id="temps" placeholder="nombre de jour/heure/mois">
                    </div>
                    <button type="submit" title="valider et payer" class="btn">Passer au paiement</button>
                </div>
            </form>
            <div id="option" class="page" style="display: none;">
                <div class="mod">
                    <button onclick="afficherPage('modifier')" class="modifier">Modifier</button>
                </div> 
                <div class="supp">
                    <input type="hidden" name="csrfmiddlewaretoken" value="{{csrf_token}}">
                    <button onclick="Supprimer()" class="supprimer">Supprimer</button>
                </div>
            </div>
            <form action="" id="Mod_form">
                {% csrf_token %}
                <div id="modifier" class="page" style="display: none;">
                    <div class="c-numero">
                        <label for="numero" class="label-c">Numero de la chambre</label>
                        <input type="number" name="numero" id="numero" placeholder="Numero de chambre" required>
                    </div>
                    <div class="c-etage">
                        <label for="etage" class="label-c">Numero de l'etage</label>
                        <input type="number" name="etage" id="etage" placeholder="Air +" required>
                    </div>
                    <div class="c-nombre">
                        <label for="nombre" class="label-c">Nombre de chambre</label>
                        <input type="number" name="nombre" id="nombre" placeholder="1" required>
                    </div>
                    <div class="c-photo">
                        <label for="photo" class="label-c">Image/Photo</label>
                        <input type="file" id="photo" name="photo" placeholder="Images" required>
                    </div>
                    <div class="c-prix_heure">
                        <label for="prix_heure" class="label-c">Prix par heure</label>
                        <input type="number" name="prix_heure" id="prix_heure" placeholder="prix/heure" required>
                    </div>
                    <div class="c-prix_jour">
                        <label for="prix_jour">Prix par jour</label>
                        <input type="number" name="prix_jour" id="prix_jour" placeholder="prix/jour" required>
                    </div>
                    <div class="c-prix_mois">
                        <label for="prix_mois" class="label-c">Prix par mois</label>
                        <input type="number" name="prix_mois" id="prix_mois" placeholder="prix/mois" required>
                    </div>
                    <button class="btn" onclick="ModifierChambre()" title="Modification">Enregistrer les modification</button>
                    <button class="annule" onclick="Annule()" title="annuler et retour">Annuler</button>              
                </div>
            </form>
            <div id="contenu_recherche" class="page" style="display: none;">

            </div>
        </div>
        <footer>
            <button onclick="afficherPage('add')" class="add" title="Ajouter un appartement">+</button>
        </footer>  
    </div>

</body>
</html>
