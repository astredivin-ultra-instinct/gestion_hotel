/* En-tête */
.photo-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.photo-icon {
    width: 70px;
    height: 70px;
    border-radius: 15px;
    background: #eef4ff;
    border: 1px solid #b9ceff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #1557d6;
    font-size: 30px;
}

.photo-text {
    flex: 1;
}

.photo-title {
    font-size: 20px;
    font-weight: 700;
    color: #111827;
}

.photo-subtitle {
    margin-top: 5px;
    color: #6b7280;
    font-size: 15px;
}

/* Compteur */
.photo-count {
    padding: 10px 18px;
    border: 1px solid #d9dee8;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    color: #374151;
    white-space: nowrap;
}

/* Zone d'ajout */
.upload-zone {
    min-height: 150px;
    border: 2px dashed #8db2ff;
    border-radius: 15px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    transition: 0.2s;
}

.upload-zone:hover {
    background: #f7faff;
    border-color: #1557d6;
}

.upload-plus {
    width: 55px;
    height: 55px;
    border-radius: 50%;

    background: #e8efff;
    color: #1557d6;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
}

.upload-text {
    margin-top: 12px;
    font-size: 16px;
    color: #1f2937;
    font-weight: 500;
}

/* Aperçus */
.preview-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.preview-item {
    position: relative;
    height: 110px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
}

.preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.remove-photo {
    position: absolute;
    top: 5px;
    right: 5px;

    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.65);
    color: white;

    cursor: pointer;
    font-size: 14px;
}

.remove-photo:hover {
    background: #dc2626;
}

/* Mobile */
@media (max-width: 600px) {

    .photo-header {
        align-items: flex-start;
    }

    .photo-icon {
        width: 55px;
        height: 55px;
        font-size: 23px;
    }

    .photo-title {
        font-size: 17px;
    }

    .photo-subtitle {
        font-size: 13px;
    }

    .photo-count {
        padding: 8px 12px;
        font-size: 14px;
    }

    .preview-container {
        grid-template-columns: repeat(2, 1fr);
    }
} 

    .option {

<body>
    <script src="{% static 'reservation/js/profile.js' %}" defer></script>

    <div class="container">
        <h2>La plateforme de reservation d'hotel</h2>

        <header>

            </div>

            <div class="nav">

            </div>
        </header>
        <div class ="main">

            <div id="acceuil" class="page" >

                    <br>
                    <br>
                    <div class="posteur">

                        </div>           
                    </div>
                </div>
            </div>
            <div id="message">

            </div>
            <div id="reservations" style="display: none;" class="page">
                <div class="reservation_list">

                </div>
            </div>

            <div id="para" class="page" style="display: none;" >
                <h2>Paramètres de réglage</h2>
                <input type="hidden" name="csrfmiddlewaretoken" value="{{csrf_token}}">
                <button class="dec" title="se déconnecter">Déconnexion</button>
            </div>
            <div id="profil" class="page" style="display: none;">

            </div>
            <form action="" id="form">
                {% csrf_token %}
                <div id="add" class="page" style="display: none;">
                    <div class="c-numero">
                        <label for="numero" class="label-c">Numero de la chambre</label>
                        <input type="number" id="numero" placeholder="Numero de chambre" required>
                    </div>
                    <div class="c-etage">
                        <label for="etage" class="label-c">Numero de l'etage</label>
                        <input type="number" id="etage" placeholder="Air +" required>
                    </div>
                    <div class="c-nombre">
                        <label for="nombre" class="label-c">Nombre de chambre</label>
                        <input type="number" id="nombre" placeholder="1" required>
                    </div>
                    <div class="c-prix_heure">
                        <label for="prix_heure" class="label-c">Prix par heure</label>
                        <input type="number" id="prix_heure" placeholder="prix/heure" required>
                    </div>
                    <div class="c-prix_jour">
                        <label for="prix_jour">Prix par jour</label>
                        <input type="number" id="prix_jour" placeholder="prix/jour" required>
                    </div>
                    <div class="c-prix_mois">
                        <label for="prix_mois" class="label-c">Prix par mois</label>
                        <input type="number" id="prix_mois" placeholder="prix/mois">
                    </div>
                    <div class="c-photo">

                            <div class="photo-icon">
                                📸
                                <i class="fa-solid fa-images"></i>
                            </div>
                            <div class="photo-text">
                                <div class="photo-title">Ajouter des images</div>
                                <div class="photo-subtitle">
                                    Ajouter entre 1 et 5 images
                                </div>
                            </div>
                            <div class="photo-count">
                                <span id="photoCount">0</span> / 5
                            </div>
                        </div>
                        <label for="photo" class="upload-zone">
                            <div class="upload-plus">
                                🌄
                                <i class="fa-solid fa-plus"></i>
                            </div>
                            <div class="upload-text">
                                Ajouter une image
                            </div>
                        </label>
                        <input type="file" id="photo" name="photo" accept="image/*" multiple placeholder="Images" hidden>
                        <div id="previewContainer" class="preview-container"></div>
                    </div>
                    <button class="btn" type="submit" title="ajouter une chambre">Ajouter</button>                
                </div>
            </form>
            <form action="" id="Rform">
                <div id="reservation" class="page" style="display: none;">
                    <div class="r-nom">
                        <label for="nom" class="label-r">Nom</label>
                        <input type="text" id="nom" placeholder="Nom" required>

                        <label for="prenom" class="label-r">Prenom</label>
                        <input type="text" id="prenom" placeholder="Prenom" required>
                    </div>
                    <div class="tel">

                        <input type="tel" id="tel" placeholder="+226 75002136" required>
                    </div>
                    <div class="r-tarif">

            <form action="" id="Mod_form">
                {% csrf_token %}

                    <div class="c-etage">
                        <label for="etage" class="label-c">Numero de l'etage</label>

                    <div class="c-nombre">
                        <label for="nombre" class="label-c">Nombre de chambre</label>

                    <div class="c-prix_mois">

                        <input type="number" name="prix_mois" id="prix_mois" placeholder="prix/mois" required>

                                📸

                            </div>

                                </div>
                            </div>
                            <div class="photo-count">
                                <span id="photoCount">0</span> / 5

                        </div>
                        <label for="photo" class="upload-zone">

                                🌄
                                <i class="fa-solid fa-plus"></i>
                            </div>
                            <div class="upload-text">

                    <button class="btn" onclick="ModifierChambre()" title="Modification">Enregistrer les modification</button>
