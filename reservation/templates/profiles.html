{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            min-height: 100vh;
            overflow: hidden;

        }
        .app-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px;
        }
        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background-color: rgb(49, 48, 48);
            color: white;
            border-bottom: 1px solid;
        }
        .main {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid;
        }
        footer {
            height: 70px;
            position: relative;
            border-top: 1px solid;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: flex;
            background-color:rgb(49, 48, 48);
        }
        .add {
            position: absolute;
            top: -25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgb(0,0,0,0.2);
            cursor: pointer;
            background-color: green;
        }
        .add:hover{
            background-color: rgb(35, 71, 35);
        }
        .add:active {
            transform:  scale(1.1);
        }
        .btn {
            width: 100%;
            background-color: green;
            border: 1px solid white;
            border-radius: 14px;
            padding: 10px 15px;
            margin-top: 10px;
        }
        .btn:hover{
            background-color: rgb(37, 80, 37);
        }
        .btn:active {
            transform: scale(1.1);
        }
        form input {
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            border: 2px solid rgb(137, 141, 142);
            border-radius: 13px;
        }
        #tarif{
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            border: 2px solid rgb(137, 141, 142);
            border-radius: 13px;         
        }
        form input:focus {
            border-color: rgba(246, 10, 10, 0.877);
            outline: none;
            box-shadow: 3px 0 2px;

        }
        form label {
            display: flex;
            width: 100%;
            max-width: 450px;
            text-align: center;
            justify-content: center;
        }
        h2 {
            font-size: 15px;
            color: rgb(14, 120, 29);
            background-color: rgb(222, 222, 222, 0.3);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            justify-content: center;
            border: 1px solid black;
            border-color: green;
            border-radius: 15px;
            width: 100%;
            padding: 14px 14px;

        }
        .head {
            background-color: white;
            border: 1px solid;
            padding: 10px 12px;
            border-radius: 50%;
        } 
        .head:hover {
            background-color: gray;
        }
        #message {
            width: 100%;
            max-width: 450px;
            padding: 12px 12px;
            text-align: center;
            justify-content: center;
            /*border: 1px solid rgb(229, 24, 24);*/
            border-radius: 13px;
            margin-top: 10px;
        }
        .dec {
            font-size: 15px;
            color: rgb(20, 13, 13);
            background-color: rgb(222, 222, 222, 0.3);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            justify-content: center;
            border: px solid black;
            border-radius: 15px;
            width: 65%;
            padding: 12px 18px;
            margin-top: 100px;
            cursor: pointer;
        }
        .dec:hover{
            background-color: rgb(168, 160, 160, 0.5);
            transform: stretch();
            /*filter: frost();
            animation: pour();
            gravity: cursor;*/
        }
        .dec:active{
            transform: scale(1.1);
        }
        .contenu {
            display: block;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 450px;
            padding: 40px 40px;
            overflow-y: auto;
        }
        .chambre-card {
            align-items: center;
            justify-content: center;
            display: block;
            width: 100%;
            max-width: 400px;
            padding: auto,        }
    </style>
</head>
<body>
    <script src="{% static 'reservation/js/profile.js' %}" defer></script>
    <div class="container">
        <header>
            <button onclick="afficherPage('para')" class="head" title="paramètres">⚙️</button>
            <button onclick="afficherPage('acceuil')" class="head" title="acceuil principal">Acceuil</button>
            <button onclick="afficherPage('profil')" class="head" title="mon profile">👤</button>
        </header>
        <div class ="main">
            <div id="acceuil" class="page" >
                <h2>La plateforme de reservation d'hotel</h2>
                <div class="acceuil-contenaire">
                    <div class="posteur">
                        <div class="contenu">
                        </div>           
                    </div>
                </div>

            </div>
            <div id="message">

            </div>
            <div id="para" class="page" style="display: none;" >
                <h2>Paramètres de réglage</h2>
                <input type="hidden" name="csrfmiddlewaretoken" value="{{csrf_token}}">
                <button class="dec" title="va te faire foutre">Déconnexion</button>
            </div>
            <div id="profil" class="page" style="display: none;"> Profile </div>
            <form action="" id="form">
                {% csrf_token %}
                <div id="add" class="page" style="display: none;">
                    <div class="c-numero">
                        <label for="numero" class="label-c">Numero de la chambre</label>
                        <input type="number" id="numero" placeholder="Numero de chambre" required>
                    </div>
                    <div class="c-etage">
                        <label for="etage" class="label-c">Numero de l'etage</label>
                        <input type="number" id="etage" placeholder="Air +" required>
                    </div>
                    <div class="c-nombre">
                        <label for="nombre" class="label-c">Nombre de chambre</label>
                        <input type="number" id="nombre" placeholder="1" required>
                    </div>
                    <div class="c-photo">
                        <label for="photo" class="label-c">Image/Photo</label>
                        <input type="file" id="photo" placeholder="Images" required>
                    </div>
                    <div class="c-prix_heure">
                        <label for="prix_heure" class="label-c">Prix par heure</label>
                        <input type="number" id="prix_heure" placeholder="prix/heure" required>
                    </div>
                    <div class="c-prix_jour">
                        <label for="prix_jour">Prix par jour</label>
                        <input type="number" id="prix_jour" placeholder="prix/jour" required>
                    </div>
                    <div class="c-prix_mois">
                        <label for="prix_mois" class="label-c">Prix par mois</label>
                        <input type="number" id="prix_mois" placeholder="prix/mois" required>
                    </div>
                    <button class="btn" type="submit" title="Enculé">Ajouter</button>                
                </div>
            </form>
            <form action="" id="Rform">
                <div id="reservation" class="page" style="display: none;">
                    <div class="r-nom">
                        <label for="nom" class="label-r">Nom</label>
                        <input type="text" id="nom" placeholder="Nom" required>
                    </div>
                    <div class="r-prenom">
                        <label for="prenom" class="label-r">Prenom</label>
                        <input type="text" id="prenom" placeholder="Prenom" required>
                    </div>
                    <div class="tel">
                        <label for="tel" class="label-r">Télephone</label>
                        <input type="tel" id="tel" placeholder="+226 75002136" required>
                    </div>
                    <div class="r-tarif">
                        <label for="tarif" class="label-r">Séjour</label>
                            <select name="tarif" id="tarif">
                                <option value="heure">heure</option>
                                <option value="jour">Jour</option>
                                <option value="mois">Mois</option>
                            </select>
                    </div>
                    <div class="r-temps">
                        <label for="temps" class="label-r">Temps</label>
                        <input type="number" id="temps" placeholder="nombre de jour/heure/mois">
                    </div>
                    <button type="submit" class="btn">Valider</button>
                </div>
            </form>
        </div>
        <footer>
            <button onclick="afficherPage('add')" class="add" title="Enfoiré">+</button>
        </footer>  
    </div>

</body>
</html>
