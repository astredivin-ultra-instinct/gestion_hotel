{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil hôtel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        header {
            height: 70px;
            background: #1455d9;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        .logo i {
            font-size: 27px;
        }

        .header-right {
            font-size: 25px;
        }

        .nav {
            display: flex;
            gap: 8px;
            background: white;
            padding: 8px;
            margin: 20px 20px 0;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .head {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px;
            border-radius: 8px;
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .head i {
            margin-right: 6px;
        }

        .head.active {
            background: #1455d9;
            color: white;
        }

        .main {
            padding: 20px;
        }

        .page {
            display: none;
        }

        .page.active-page {
            display: block;
        }

        #message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .title h2 {
            font-size: 24px;
        }

        .btn-add {
            border: none;
            background: #1455d9;
            color: white;
            padding: 11px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add i {
            margin-right: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .stat-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: #edf3ff;
            color: #1455d9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            margin-bottom: 12px;
        }

        .stat strong {
            display: block;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .stat span {
            color: #64748b;
            font-size: 13px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .rooms {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .room {
            background: white;
            min-height: 105px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .room-photo {
            width: 100px;
            height: 80px;
            object-fit: cover;
            border-radius: 9px;
            background: #e9edf5;
        }

        .room-info {
            flex: 1;
        }

        .room-info h3 {
            font-size: 17px;
            margin-bottom: 6px;
        }

        .room-info p {
            color: #64748b;
            font-size: 13px;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #15803d;
            font-size: 12px;
            font-weight: bold;
        }
        .occupe {
            background-color: rgb(238, 195, 115);
            color: rgb(207, 63, 11);
            padding: 7px 12px;
            border-radius: 20px ;
            font-size: 12px;
            font-weight: bold;
        }

        .price {
            min-width: 120px;
            text-align: center;
            font-weight: bold;
        }

        .price small {
            display: block;
            color: #64748b;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .action {
            width: 40px;
            height: 40px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .edit {
            color: #1455d9;
        }

        .delete {
            color: #dc2626;
        }

        .reservation_list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .reservation {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .reservation-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .reservation p {
            margin: 6px 0;
            color: #475569;
        }

        .total {
            color: #1455d9;
            font-size: 18px;
            font-weight: bold;
        }

        .profile-card,
        #form,
        #Mod_form,
        .option-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 15px;
        }

        .profile-card h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .profile-info {
            text-align: center;
            line-height: 1.8;
            color: #475569;
        }

        .profile-rooms {
            margin-top: 25px;
        }

        form label {
            display: block;
            margin: 13px 0 6px;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
        }

        form input {
            width: 100%;
            padding: 11px;
            border: 1px solid #dbe1ea;
            border-radius: 8px;
            outline: none;
        }

        form input:focus {
            border-color: #1455d9;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #1455d9;
            color: white;
        }

        .annule {
            background: #f1f5f9;
            color: #475569;
        }

        .photo-zone {
            margin-top: 15px;
        }

        .upload {
            border: 2px dashed #b9c8e8;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            color: #1455d9;
        }

        .upload i {
            font-size: 30px;
            display: block;
            margin-bottom: 8px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .preview-item {
            height: 90px;
            position: relative;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .remove-photo {
            position: absolute;
            top: 4px;
            right: 4px;
            border: none;
            background: #dc2626;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
        }

        .option-card button {
            width: 100%;
            padding: 14px;
            border: none;
            background: white;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            font-size: 15px;
        }

        .option-card button i {
            margin-right: 8px;
        }

        .danger {
            color: #dc2626;
        }

        .logout {
            width: 100%;
            padding: 13px;
            border: none;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .room {
                flex-wrap: wrap;
            }

            .room-photo {
                width: 90px;
            }

            .price {
                min-width: auto;
            }

            .actions {
                margin-left: auto;
            }
        }

        @media (max-width: 450px) {
            .nav {
                margin: 10px;
            }

            .head {
                font-size: 11px;
                padding: 10px 4px;
            }

            .head i {
                display: block;
                margin: 0 0 3px;
                text-align: center;
            }

            .main {
                padding: 12px;
            }

            .stats {
                gap: 8px;
            }

            .stat {
                padding: 14px;
            }

            .stat strong {
                font-size: 20px;
            }

            .room-photo {
                width: 80px;
                height: 70px;
            }
        }
        .ti.ti-wallet {
            color: #15803d;
        }
        .ti.ti-chart-bar {
            color: red;
        }
        .ti.ti-bed {
            color: black;
        }
  
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">
            <i class="ti ti-building-hotel"></i>
            <span id="hotelNom">Hôtel</span>
        </div>

        <div class="header-right">
            <i class="ti ti-user-circle"></i>
        </div>
    </header>

    <div class="nav">
        <button class="head active" onclick="afficherPage('acceuil', this)">
            <i class="ti ti-layout-dashboard"></i> Tableau de bord
        </button>

        <button class="head" onclick="afficherPage('reservations', this)">
            <i class="ti ti-calendar-event"></i> Réservations
        </button>

        <button class="head" onclick="afficherPage('profil', this)">
            <i class="ti ti-user"></i> Profil
        </button>

        <button class="head" onclick="afficherPage('para', this)">
            <i class="ti ti-settings"></i> Paramètres
        </button>
    </div>

    <main class="main">

        <div id="message"></div>

        <!-- ACCUEIL -->
        <section id="acceuil" class="page active-page">

            <div class="title">
                <h2>Tableau de bord</h2>

                <button class="btn-add" onclick="afficherPage('add')">
                    <i class="ti ti-plus"></i>
                    Ajouter une chambre
                </button>
            </div>

            <div class="stats">

                <div class="stat">
                    <div class="stat-icon">
                        <i class="ti ti-bed"></i>
                    </div>
                    <strong id="totalChambres">0</strong>
                    <span>Chambres totales</span>
                </div>

                <div class="stat">
                    <div class="stat-icon">
                        <i class="ti ti-calendar-check"></i>
                    </div>
                    <strong id="totalReservations">0</strong>
                    <span>Réservations</span>
                </div>

                <div class="stat">
                    <div class="stat-icon">
                        <i class="ti ti-chart-bar"></i>
                    </div>
                    <strong id="occupation">0</strong>
                    <span>Taux d'occupation</span>
                </div>

                <div class="stat">
                    <div class="stat-icon">
                        <i class="ti ti-wallet"></i>
                    </div>
                    <strong id="revenus">0</strong>
                    <span>Revenus</span>
                </div>

            </div>

            <h2 class="section-title">Mes chambres</h2>

            <div id="rooms" class="rooms"></div>

        </section>

        <!-- RESERVATIONS -->
        <section id="reservations" class="page">

            <div class="title">
                <h2>Réservations</h2>
            </div>

            <div class="reservation_list"></div>

        </section>

        <!-- PROFIL -->
        <section id="profil" class="page"></section>

        <!-- PARAMETRES -->
        <section id="para" class="page">

            <div class="title">
                <h2>Paramètres</h2>
            </div>

            <div class="profile-card">

                <h3>Compte</h3>

                <button class="logout dec">
                    <i class="ti ti-logout"></i>
                    Déconnexion
                </button>

            </div>

        </section>

        <!-- OPTIONS -->
        <section id="option" class="page">

            <div class="option-card">

                <button onclick="afficherPage('modifier')">
                    <i class="ti ti-edit"></i>
                    Modifier la chambre
                </button>

                <button class="danger supp">
                    <i class="ti ti-trash"></i>
                    Supprimer la chambre
                </button>

                <button onclick="afficherPage('acceuil')">
                    <i class="ti ti-arrow-left"></i>
                    Retour
                </button>

            </div>

        </section>

        <!-- MODIFICATION -->
        <section id="modifier" class="page">

            <form id="Mod_form">

                {% csrf_token %}

                <label>Numéro de la chambre</label>
                <input type="number" id="mod_numero" name="numero" required>

                <label>Nombre de chambre</label>
                <input type="number" id="mod_nombre" name="nombre" required>
                
                <label>Étage</label>
                <input type="number" id="mod_etage" name="etage" required>
                
                <label>Prix par heure</label>
                <input type="number" id="mod_prix_heure" name="prix_heure" required>

                <label>Prix par jour</label>
                <input type="number" id="mod_prix_jour" name="prix_jour" required>

                <label>Prix par mois</label>
                <input type="number" id="mod_prix_mois" name="prix_mois">

                <button type="submit" class="btn btn-primary">
                    Enregistrer les modifications
                </button>

                <button type="button" class="btn annule" onclick="afficherPage('acceuil')">
                    Annuler
                </button>

            </form>

        </section>

        <!-- AJOUT -->
        <section id="add" class="page">

            <form id="form">

                {% csrf_token %}

                <label>Numéro de la chambre</label>
                <input type="number" id="numero" required>

                <label>Étage</label>
                <input type="number" id="etage" required>

                <label>Nombre de chambre</label>
                <input type="number" id="nombre" required>

                <label>Prix par heure</label>
                <input type="number" id="prix_heure" required>

                <label>Prix par jour</label>
                <input type="number" id="prix_jour" required>

                <label>Prix par mois</label>
                <input type="number" id="prix_mois">

                <div class="photo-zone">

                    <label>Photos de la chambre</label>

                    <div class="upload" onclick="document.getElementById('photo').click()">
                        <i class="ti ti-camera-plus"></i>
                        Ajouter des photos
                        <small>(1 à 5 images)</small>
                    </div>

                    <input type="file" id="photo" accept="image/*" multiple hidden>

                    <div class="preview-container" id="previewContainer"></div>

                </div>

                <button type="submit" class="btn btn-primary">
                    Enregistrer la chambre
                </button>

                <button type="button" class="btn annule" onclick="afficherPage('acceuil')">
                    Annuler
                </button>

            </form>

        </section>

    </main>
</div>

<script src="{% static 'reservation/js/profile.js' %}" defer></script>

</body>
</html>
